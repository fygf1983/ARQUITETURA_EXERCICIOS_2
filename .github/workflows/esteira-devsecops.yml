name: Esteira DevSecOps — Core Box

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  issues: write

jobs:
  etapa-1-gitleaks:
    name: "01. Secret Scanning (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Executar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  etapa-2-semgrep:
    name: "02. SAST (Semgrep)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Executar Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/python
            p/flask
            p/secrets
            p/dockerfile
            ./core-box/.semgrep/
        env:
          SEMGREP_METRICS: "0"

  etapa-3-build-testes:
    name: "03. Build & Testes (Pytest)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Instalar Dependências e Executar Testes
        run: |
          cd core-box
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pytest --junitxml=junit.xml -v
      - name: Publicar Relatório de Testes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-03-build
          path: core-box/junit.xml

  etapa-4-trivy-sca:
    name: "04. SCA Dependências (Trivy)"
    runs-on: ubuntu-latest
    needs: [etapa-3-build-testes]
    steps:
      - uses: actions/checkout@v4
      - name: Executar Trivy (FS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './core-box'
          format: 'json'
          output: 'trivy-fs-report.json'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
      - name: Publicar Relatório SCA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-04-trivy-sca
          path: trivy-fs-report.json

  etapa-5-docker-build:
    name: "05. Docker Build & Push"
    runs-on: ubuntu-latest
    needs: [etapa-1-gitleaks, etapa-2-semgrep, etapa-3-build-testes, etapa-4-trivy-sca]
    outputs:
      image_tag: ghcr.io/${{ github.repository_owner }}/core-box
      image_digest: ${{ steps.build-image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build e Push da Imagem
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: ./core-box
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/core-box:sha-${{ github.sha }}

  etapa-6-trivy-image:
    name: "06. Scan da Imagem (Trivy)"
    runs-on: ubuntu-latest
    needs: [etapa-5-docker-build]
    steps:
      - name: Preparar supressao de falso positivo SBOM
        run: echo "CVE-2025-47273" > /tmp/.trivyignore
      - name: Executa Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          trivyignores: /tmp/.trivyignore
          image-ref: '${{ needs.etapa-5-docker-build.outputs.image_tag }}@${{ needs.etapa-5-docker-build.outputs.image_digest }}'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

  etapa-7-homologacao-zap:
    name: "07. Homologação & DAST (ZAP)"
    runs-on: ubuntu-latest
    needs: [etapa-5-docker-build, etapa-6-trivy-image]
    steps:
      - name: Subir container para homologação
        run: |
          docker run -d --name core-box-homolog -p 8000:8000 \
            -e BOX_JWT_SECRET="homolog-jwt-secret-key-32-bytes-ok" \
            -e BOX_SECRET_KEY="homolog-flask-secret-key-32-bytes" \
            ${{ needs.etapa-5-docker-build.outputs.image_tag }}@${{ needs.etapa-5-docker-build.outputs.image_digest }}
          sleep 8
      - name: Executar OWASP ZAP Baseline Scan
        run: |
          mkdir -p zap-wrk && chmod 777 zap-wrk
          docker run --rm --network=host \
            -v $(pwd)/zap-wrk:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8000/health \
            -J report_json.json -w report_md.md -r report_html.html -I || true
      - name: Publicar Relatório ZAP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homologacao-zap
          path: zap-wrk/

  etapa-8-deploy:
    name: "08. Aprovação & Produção (VPS)"
    runs-on: ubuntu-latest
    needs: [etapa-5-docker-build, etapa-7-homologacao-zap]
    environment: producao
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "StrictHostKeyChecking no" > ~/.ssh/config
          echo "UserKnownHostsFile /dev/null" >> ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Transferir Arquivos de Deploy
        run: |
          cd core-box
          scp -r deploy/docker-compose.prod.yml deploy/deploy.sh admin@${{ vars.PROD_HOST }}:/opt/core-box/
      - name: Executar Deploy na VPS
        run: |
          ssh admin@${{ vars.PROD_HOST }} << 'EOF_SSH'
            cd /opt/core-box
            export IMAGEM="${{ needs.etapa-5-docker-build.outputs.image_tag }}@${{ needs.etapa-5-docker-build.outputs.image_digest }}"
            export BOX_JWT_SECRET="${{ secrets.BOX_JWT_SECRET }}"
            export BOX_SECRET_KEY="${{ secrets.BOX_SECRET_KEY }}"
            chmod +x ./deploy.sh
            ./deploy.sh
          EOF_SSH
      - name: Smoke Test em Produção
        run: |
          curl -f http://${{ vars.PROD_HOST }}/health

  resumo-esteira:
    name: Resumo da Esteira
    needs: [etapa-1-gitleaks, etapa-2-semgrep, etapa-3-build-testes, etapa-4-trivy-sca, etapa-5-docker-build, etapa-6-trivy-image, etapa-7-homologacao-zap, etapa-8-deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publicar Tabela de Resumo
        run: |
          echo "## Resumo da Execução da Esteira DevSecOps" >> $GITHUB_STEP_SUMMARY
          echo "| Etapa | Ferramenta | Política | Resultado |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 1. Segredos | Gitleaks | Bloqueante | ${{ needs.etapa-1-gitleaks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2. SAST | Semgrep | Bloqueante | ${{ needs.etapa-2-semgrep.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 3. Testes | Pytest | Bloqueante | ${{ needs.etapa-3-build-testes.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 4. SCA | Trivy fs | Bloqueante | ${{ needs.etapa-4-trivy-sca.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 5. Imagem | Buildx + GHCR | Bloqueante | ${{ needs.etapa-5-docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 6. Container | Trivy image | Bloqueante | ${{ needs.etapa-6-trivy-image.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 7. DAST | OWASP ZAP | Informativo | ${{ needs.etapa-7-homologacao-zap.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 8. Deploy | VPS / SSH | Aprovação | ${{ needs.etapa-8-deploy.result }} |" >> $GITHUB_STEP_SUMMARY
